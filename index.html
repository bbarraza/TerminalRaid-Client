<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TerminalRaid CLI</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #1e1e1e; /* dark terminal background */
      font-family: monospace;
      overflow: hidden; /* remove scrollbars */
    }
    #terminal {
      height: 100%;
      width: 100%;
    }
    ::-webkit-scrollbar {
      display: none; /* hide any scrollbars */
    }
  </style>
</head>

  <div id="terminal"></div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
